# Start:   docker compose up -d --build
# Domæne:  sæt DOMAIN=supervision.example.dk i .env (porte 80/443 skal pege på serveren)
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SUPERVISION_DATA_DIR: /data
      SUPERVISION_SESSION_HOURS: ${SUPERVISION_SESSION_HOURS:-12}
      SUPERVISION_IDLE_MINUTES: ${SUPERVISION_IDLE_MINUTES:-60}
      SUPERVISION_MAX_FILE_MB: ${SUPERVISION_MAX_FILE_MB:-15}
      SUPERVISION_QUOTA_MB: ${SUPERVISION_QUOTA_MB:-250}
    volumes:
      - supervision-data:/data
    # Ingen "ports": appen er kun tilgængelig via Caddy, så proxy-headerne kan stoles på.
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [internal]

volumes:
  supervision-data:
  caddy-data:
  caddy-config:

networks:
  internal:
