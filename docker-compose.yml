# Start:  docker compose up -d --build
# Appen lytter på port 9473 på alle interfaces – sæt en reverse proxy med TLS (fx nginx) foran. Se README.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SUPERVISION_DATA_DIR: /data
      SUPERVISION_SESSION_HOURS: ${SUPERVISION_SESSION_HOURS:-12}
      SUPERVISION_IDLE_MINUTES: ${SUPERVISION_IDLE_MINUTES:-60}
      SUPERVISION_MAX_FILE_MB: ${SUPERVISION_MAX_FILE_MB:-15}
      SUPERVISION_QUOTA_MB: ${SUPERVISION_QUOTA_MB:-250}
      # X-Forwarded-For stoles kun på fra disse adresser. Standard er compose-netværket, dvs. nginx på samme vært.
      # Kører nginx på en anden maskine, så sæt SUPERVISION_TRUSTED_PROXIES til dens IP.
      # Andre klienter beholder deres egen IP, så rate-limiting ikke kan snydes med en falsk header.
      FORWARDED_ALLOW_IPS: ${SUPERVISION_TRUSTED_PROXIES:-10.203.64.0/28}
    ports:
      - "${SUPERVISION_BIND:-0.0.0.0}:${SUPERVISION_PORT:-9473}:9473"
    volumes:
      - supervision-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]

volumes:
  supervision-data:

networks:
  internal:
    # Fast, lille subnet, så compose ikke afhænger af Dockers standard-adressepuljer
    # (fejlen "all predefined address pools have been fully subnetted"). Skift i .env ved konflikt.
    ipam:
      config:
        - subnet: ${SUPERVISION_SUBNET:-10.203.64.0/28}
